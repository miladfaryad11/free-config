name: Collect and Publish

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت یکبار اجرا می‌شود
  workflow_dispatch:        # امکان اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install aiohttp

    - name: Run collector
      run: python main.py

    - name: Commit and push output files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/
        # اگر تغییری وجود داشته باشد، commit می‌کند
        git diff --staged --quiet || git commit -m "Auto-update configs $(date '+%Y-%m-%d %H:%M:%S')"
        git push
